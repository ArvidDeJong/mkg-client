title: darvis/mkg-client
description: PHP client for the REST API of MKG Software, the Dutch ERP system. Handles the Tomcat form login and the JSESSIONID session, and offers a typed service per MKG document. Framework-agnostic, with Laravel integration.
url: https://arviddejong.github.io
baseurl: /mkg-client

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# docs/README.md is the index for browsing on GitHub; the site has its own index.md.
exclude:
  - README.md

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/mkg-client
  repository: https://github.com/ArvidDeJong/mkg-client
  packagist: https://packagist.org/packages/darvis/mkg-client
  license_url: https://github.com/ArvidDeJong/mkg-client/blob/main/LICENSE
  requires: PHP 8.2+ and valid MKG API credentials; Laravel 11, 12 or 13 only for the Laravel integration
  platforms: [PHP, Laravel]
  keywords: [mkg, mkg software, erp, erp integration, api client, rest api, php, laravel, jsessionid]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/mkg-client
  Packagist: https://packagist.org/packages/darvis/mkg-client
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/mkg-client
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
